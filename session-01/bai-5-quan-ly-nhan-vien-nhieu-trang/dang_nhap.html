<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập (giao diện mẫu)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <!-- Component: MainLayout (src/components/MainLayout.jsx) -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <h1 class="navbar-brand h4 mb-0">Quản lý nhân viên</h1>
      <ul class="navbar-nav flex-row flex-wrap align-items-center gap-3 ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="danh_sach.html">Nhân viên</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="form.html">Thêm nhân viên</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="dang_nhap.html">Đăng nhập</a>
          </li>
      </ul>
    </div>
  </nav>
  <!-- Hết: MainLayout -->

  <!-- Vị trí của Outlet: nội dung của từng trang nằm trong main -->
  <main class="container py-4">
    <!-- Component: LoginPage (src/pages/LoginPage.jsx) -->
    <section class="col-md-6 col-lg-4 mx-auto">
      <h2 class="h4 mb-3">Đăng nhập bằng email nhân viên</h2>
      <form class="mb-3">
        <label class="form-label" for="login-email">Email</label>
        <input class="form-control mb-3" id="login-email">
        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
      </form>
    </section>
    <!-- Hết: LoginPage -->
  </main>

  <!-- ===== Bảng trạng thái (không phải màn hình thật, chỉ để đối chiếu các trạng thái) ===== -->
  <section class="container pb-5">
    <hr>
    <h2 class="h5 text-muted">Bảng trạng thái</h2>
    <p class="small fw-bold text-uppercase text-muted mt-4 mb-2">Email không có trong danh sách (hoặc để trống)</p>
    <div class="alert alert-danger" role="alert">Không tìm thấy nhân viên với email này.</div>
    <p class="small fw-bold text-uppercase text-muted mt-4 mb-2">Nhân viên đã nghỉ việc</p>
    <div class="alert alert-danger" role="alert">Tài khoản đã ngừng hoạt động.</div>

  </section>
</body>
</html>
